<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" role="img" aria-labelledby="t d">
<title id="t">c-check lab test: bad cases caught per rule, with 95% range</title>
<desc id="d">no-test-weakening: caught 23 of 25 (95% range 75% to 97.8%), good cases flagged: 1 block of 74. no-data-before-login: caught 15 of 15 (95% range 79.6% to 100%), good cases flagged: none of 74. tests-still-bite: caught 15 of 15 (95% range 79.6% to 100%), good cases flagged: 3 warnings of 74. no-risky-commands: caught 7 of 9 (95% range 45.3% to 93.7%), good cases flagged: none of 74. no-secrets-in-files: caught 4 of 7 (95% range 25% to 84.2%), good cases flagged: none of 74. tests-pass-before-done: caught 6 of 6 (95% range 61% to 100%), good cases flagged: none of 74. no-test-bloat: caught 5 of 5 (95% range 56.6% to 100%), good cases flagged: none of 74. deploy-gate: caught 3 of 3 (95% range 43.8% to 100%), good cases flagged: none of 74. no-outside-edits: caught 3 of 3 (95% range 43.8% to 100%), good cases flagged: none of 74.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; font-variant-numeric: tabular-nums; }
  .head { font-size: 15px; font-weight: 600; }
  .sub { font-size: 12.5px; fill: #59636e; }
  .rule { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; }
  .frac { font-size: 14px; font-weight: 600; }
  .tick { font-size: 11.5px; fill: #59636e; }
  .none { font-size: 13px; fill: #59636e; }
  .flag { font-size: 13px; font-weight: 600; fill: #9a6700; }
  .grid { stroke: #d1d9e0; stroke-width: 1; }
  .grid.minor { stroke-dasharray: 2 4; }
  .range { fill: #0f766e; opacity: .22; }
  .point { fill: #0f766e; stroke: #ffffff; stroke-width: 2; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .sub, .tick, .none { fill: #9198a1; }
    .flag { fill: #d29922; }
    .grid { stroke: #3d444d; }
    .range { fill: #2dd4bf; opacity: .28; }
    .point { fill: #2dd4bf; stroke: #0d1117; }
  }
</style>
<text class="head" x="230" y="28">Bad cases caught</text>
<text class="sub" x="230" y="47">Dot is the score. Bar is the 95% range: fewer cases, wider bar.</text>
<text class="head" x="836" y="28" text-anchor="end">Good cases flagged</text>
<text class="sub" x="836" y="47" text-anchor="end">out of 74</text>
