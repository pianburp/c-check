name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # replay commits in temp repos
      - run: |
          git config --global user.name ci
          git config --global user.email ci@example.com
          git config --global init.defaultBranch main
      - run: npm run typecheck
      - run: npm run test:unit
      - run: node evals/replay.ts --json evals/results/latest.json
      - run: node evals/compare.ts evals/baseline.json evals/results/latest.json
